name: mobile_app
description: Quest App - Mobile user-facing application.
version: 1.1.8+75
publish_to: none

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Internal packages
  app_core:
    path: ../../packages/app_core
  app_models:
    path: ../../packages/app_models
  app_repositories:
    path: ../../packages/app_repositories
  shared_ui:
    path: ../../packages/shared_ui
  supabase_contracts:
    path: ../../packages/supabase_contracts

  # State management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0

  # Routing
  go_router: ^13.0.0

  # Backend

  # UI/UX
  cached_network_image: ^3.3.0
  image_picker: ^1.0.0
  url_launcher: ^6.2.0
  video_player: ^2.11.1
  chewie: ^1.13.0
  connectivity_plus: ^6.0.0
  flutter_image_compress: ^2.1.0
  shimmer: ^3.0.0
  haptic_feedback: ^0.5.1+1
  shared_preferences: ^2.2.0
  share_plus: ^12.0.1
  mixpanel_flutter: ^2.3.0
  video_compress: ^3.1.3
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  http: ^1.2.0
  flutter_local_notifications: ^18.0.0

  intl: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  riverpod_generator: ^2.3.0
  build_runner: ^2.4.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/Bsheel.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/brand/

  fonts:
    # Syne is a variable font bundled at a single ExtraBold snapshot.
    # Map every requested weight to the same asset so Flutter never
    # falls back to the system sans when the theme asks for 400/500/600/700.
    - family: Syne
      fonts:
        - asset: assets/fonts/Syne-ExtraBold.ttf
          weight: 400
        - asset: assets/fonts/Syne-ExtraBold.ttf
          weight: 500
        - asset: assets/fonts/Syne-ExtraBold.ttf
          weight: 600
        - asset: assets/fonts/Syne-ExtraBold.ttf
          weight: 700
        - asset: assets/fonts/Syne-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Syne-ExtraBold.ttf
          weight: 900
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 700
        # 800/900 fall back to SemiBold until DMSans-Bold/Black .ttf are added
        # (splash uses w900 for the BOOTING ARCADE / PLAY YOUR DAY labels).
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 800
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 900
    # Mono font is shipped as a single Bold variant. Flutter aliases all
    # requested weights to it automatically when only one is declared,
    # so we don't need the 5-row weight table that was here before
    # (ARC-030).
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
