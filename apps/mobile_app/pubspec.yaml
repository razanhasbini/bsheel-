name: mobile_app
description: Quest App - Mobile user-facing application.
version: 1.1.8+75
publish_to: none

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Internal packages
  app_core:
    path: ../../packages/app_core
  app_models:
    path: ../../packages/app_models
  app_repositories:
    path: ../../packages/app_repositories
  shared_ui:
    path: ../../packages/shared_ui
  app_contracts:
    path: ../../packages/app_contracts

  # State management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0

  # Routing
  go_router: ^18.0.1

  # Backend

  # UI/UX
  cached_network_image: ^3.3.0
  image_picker: ^1.0.0
  url_launcher: ^6.2.0
  video_player: ^2.11.1
  chewie: ^1.13.0
  connectivity_plus: ^6.0.0
  flutter_image_compress: ^2.1.0
  shimmer: ^3.0.0
  haptic_feedback: ^0.5.1+1
  shared_preferences: ^2.2.0
  share_plus: ^12.0.1
  # The web build's download path: Blob + <a download>, because the Web
  # Share API cannot share files on desktop Chrome or Firefox.
  web: ^1.1.0
  mixpanel_flutter: ^2.3.0
  video_compress: ^3.1.3
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  http: ^1.2.0
  # Somewhere to write the branded image before handing it to the system
  # share sheet, which is what offers "Save to Photos".
  path_provider: ^2.1.4
  flutter_local_notifications: ^18.0.0

  intl: any
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.2
  visibility_detector: ^0.4.0+2
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  riverpod_generator: ^2.3.0
  build_runner: ^2.4.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/Bsheel.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/map/
    - assets/icons/
    - assets/brand/

  fonts:
    # Arcade Pop type, as variable fonts so every weight the design asks
    # for is a real cut rather than an alias. Pair `fontWeight` with a
    # `fontVariations` wght entry — see QuestTypography.
    - family: Syne
      fonts:
        - asset: assets/fonts/Syne-Variable.ttf
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
