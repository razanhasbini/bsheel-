name: admin_web
description: Quest App - Admin web dashboard.
version: 0.0.1
publish_to: none

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # Internal packages
  app_core:
    path: ../../packages/app_core
  app_models:
    path: ../../packages/app_models
  app_repositories:
    path: ../../packages/app_repositories
  shared_ui:
    path: ../../packages/shared_ui
  app_contracts:
    path: ../../packages/app_contracts

  # State management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0

  # Routing
  go_router: ^13.0.0

  # Backend
  url_launcher: ^6.3.2
  http: ^1.2.0

  # Required by app_repositories (social auth)
  google_sign_in: ^6.1.0
  sign_in_with_apple: ^6.1.0
  crypto: ^3.0.0

  # Excel import for quest management
  excel: ^4.0.6
  file_picker: ^8.1.4

  web: ^1.1.0
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  riverpod_generator: ^2.3.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  fonts:
    # Arcade Pop type — the same three families the mobile app bundles.
    # Syne ships as a single ExtraBold snapshot; every requested weight maps
    # to it so Flutter never falls back to the system sans.
    - family: Syne
      fonts:
        - asset: assets/fonts/Syne-ExtraBold.ttf
          weight: 400
        - asset: assets/fonts/Syne-ExtraBold.ttf
          weight: 500
        - asset: assets/fonts/Syne-ExtraBold.ttf
          weight: 600
        - asset: assets/fonts/Syne-ExtraBold.ttf
          weight: 700
        - asset: assets/fonts/Syne-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Syne-ExtraBold.ttf
          weight: 900
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 700
    # Mono ships as a single Bold cut; Flutter aliases every weight to it.
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
