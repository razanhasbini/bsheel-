<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FFF9EE" />

  <title>BSHEEL — Open in app</title>

  <!-- Open Graph / Twitter -->
  <meta property="og:site_name" content="BSHEEL" />
  <meta property="og:title" content="BSHEEL" />
  <meta property="og:description" content="Real-world quests. Real XP. Tap to open in the BSHEEL app." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://admin.bsheel.app/bsheel-icon.png" />
  <meta property="og:image:width" content="1024" />
  <meta property="og:image:height" content="1024" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="BSHEEL" />
  <meta name="twitter:description" content="Real-world quests. Real XP. Tap to open in the BSHEEL app." />
  <meta name="twitter:image" content="https://admin.bsheel.app/bsheel-icon.png" />

  <!-- iOS Smart App Banner. Replace 0000000000 with the App Store ID once published. -->
  <meta name="apple-itunes-app" content="app-id=0000000000" />

  <link rel="icon" href="/bsheel-icon.png" />
  <link rel="apple-touch-icon" href="/bsheel-icon.png" />

  <style>
    :root {
      --cream: #FFF9EE;
      --ink: #1A1330;
      --violet: #6B3BFF;
      --coral: #FF5A6E;
      --gold: #FFC224;
      --green: #17C27B;
      --shadow: 0 1px 0 rgba(26, 19, 48, 0.08), 0 4px 16px rgba(26, 19, 48, 0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, "Helvetica Neue", Roboto, sans-serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100%;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      min-height: 100svh;
      background: radial-gradient(circle at 20% 0%, rgba(107, 59, 255, 0.08), transparent 50%),
                  radial-gradient(circle at 80% 100%, rgba(255, 194, 36, 0.08), transparent 50%),
                  var(--cream);
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: #fff;
      border: 2px solid var(--ink);
      border-radius: 24px;
      box-shadow: 6px 6px 0 var(--ink);
      padding: 36px 28px 28px;
      text-align: center;
      animation: cardIn 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0)   scale(1); }
    }
    .logo-wrap {
      width: 96px;
      height: 96px;
      margin: 0 auto 18px;
      border-radius: 22px;
      border: 2px solid var(--ink);
      box-shadow: 4px 4px 0 var(--ink);
      overflow: hidden;
      background: var(--cream);
      animation: bob 3.6s ease-in-out infinite;
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-3px); }
    }
    .logo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    h1 {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .tagline {
      font-size: 14px;
      color: #5A5170;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .open-btn {
      display: block;
      width: 100%;
      background: var(--violet);
      color: #fff;
      border: 2px solid var(--ink);
      border-radius: 12px;
      box-shadow: 4px 4px 0 var(--ink);
      padding: 15px 16px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .open-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 5px 5px 0 var(--ink);
    }
    .open-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--ink);
    }
    .stores {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
    .store-btn {
      flex: 1;
      padding: 12px 10px;
      background: var(--cream);
      color: var(--ink);
      border: 2px solid var(--ink);
      border-radius: 10px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      text-decoration: none;
      text-align: center;
      transition: transform 0.08s ease;
    }
    .store-btn:hover { transform: translateY(-1px); }
    .divider {
      margin: 22px 0 14px;
      font-size: 11px;
      letter-spacing: 2.5px;
      color: #9A91B0;
      text-transform: uppercase;
      position: relative;
    }
    .divider::before,
    .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 28%;
      height: 1px;
      background: rgba(26, 19, 48, 0.12);
    }
    .divider::before { left: 0; }
    .divider::after  { right: 0; }
    .ig {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border: 2px solid var(--ink);
      border-radius: 999px;
      background: var(--gold);
      color: var(--ink);
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
      box-shadow: 3px 3px 0 var(--ink);
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }
    .ig:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 var(--ink);
    }
    .ig:active {
      transform: translate(1px, 1px);
      box-shadow: 2px 2px 0 var(--ink);
    }
    .ig svg { width: 16px; height: 16px; }
    .footer {
      margin-top: 22px;
      font-size: 10px;
      color: #9A91B0;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    @media (max-width: 360px) {
      .card { padding: 28px 20px 22px; }
      h1 { font-size: 26px; letter-spacing: 3px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo-wrap">
      <img class="logo" src="/bsheel-icon.png" alt="BSHEEL" />
    </div>
    <h1>BSHEEL</h1>
    <p class="tagline" id="tagline">Real-world quests. Real XP.</p>

    <a class="open-btn" id="openApp" href="#">OPEN IN APP</a>

    <div class="stores">
      <a class="store-btn" id="iosStore" href="#" rel="noopener">APP STORE</a>
      <a class="store-btn" id="androidStore" href="https://play.google.com/store/apps/details?id=com.questapp.mobile_app" rel="noopener">GOOGLE PLAY</a>
    </div>

    <div class="divider">Or follow us</div>
    <a class="ig" href="https://instagram.com/bsheel.app" rel="noopener" target="_blank">
      <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2.2c3.2 0 3.6 0 4.8.1 1.2.1 1.8.2 2.2.4.6.2 1 .5 1.4 1 .5.4.8.8 1 1.4.2.4.4 1 .4 2.2.1 1.2.1 1.6.1 4.8s0 3.6-.1 4.8c-.1 1.2-.2 1.8-.4 2.2-.2.6-.5 1-1 1.4-.4.5-.8.8-1.4 1-.4.2-1 .4-2.2.4-1.2.1-1.6.1-4.8.1s-3.6 0-4.8-.1c-1.2-.1-1.8-.2-2.2-.4-.6-.2-1-.5-1.4-1-.5-.4-.8-.8-1-1.4-.2-.4-.4-1-.4-2.2C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.8c.1-1.2.2-1.8.4-2.2.2-.6.5-1 1-1.4.4-.5.8-.8 1.4-1 .4-.2 1-.4 2.2-.4C8.4 2.2 8.8 2.2 12 2.2zm0 1.8c-3.1 0-3.5 0-4.7.1-1 .1-1.5.2-1.9.3-.5.2-.8.4-1.2.7-.3.4-.5.7-.7 1.2-.1.4-.2.9-.3 1.9-.1 1.2-.1 1.6-.1 4.7s0 3.5.1 4.7c.1 1 .2 1.5.3 1.9.2.5.4.8.7 1.2.4.3.7.5 1.2.7.4.1.9.2 1.9.3 1.2.1 1.6.1 4.7.1s3.5 0 4.7-.1c1-.1 1.5-.2 1.9-.3.5-.2.8-.4 1.2-.7.3-.4.5-.7.7-1.2.1-.4.2-.9.3-1.9.1-1.2.1-1.6.1-4.7s0-3.5-.1-4.7c-.1-1-.2-1.5-.3-1.9-.2-.5-.4-.8-.7-1.2-.4-.3-.7-.5-1.2-.7-.4-.1-.9-.2-1.9-.3C15.5 4 15.1 4 12 4zm0 3.1a4.9 4.9 0 1 1 0 9.8 4.9 4.9 0 0 1 0-9.8zm0 1.8a3.1 3.1 0 1 0 0 6.2 3.1 3.1 0 0 0 0-6.2zm5.1-2c.7 0 1.2.5 1.2 1.2s-.5 1.2-1.2 1.2-1.2-.5-1.2-1.2.5-1.2 1.2-1.2z"/>
      </svg>
      @bsheel.app
    </a>
    <div class="footer">YOUR DAILY QUEST AWAITS</div>
  </main>

  <script>
    (function () {
      // Configurable store URLs. iOS App Store ID is a placeholder — replace
      // with the real one (e.g. 1234567890) once the app is on the App Store.
      var APP_STORE_URL = 'https://apps.apple.com/app/id0000000000';
      var PLAY_STORE_URL = 'https://play.google.com/store/apps/details?id=com.questapp.mobile_app';

      var ua = navigator.userAgent || '';
      var isIOS = /iPhone|iPad|iPod/.test(ua) && !window.MSStream;
      var isAndroid = /Android/i.test(ua);
      var isMobile = isIOS || isAndroid;

      // Build the in-app destination. Triple-slash so the URL has an empty
      // authority and the path begins with /post|/user|/join — matching the
      // GoRouter routes inside the app. With double-slash the app would
      // see "post" as the host and the route lookup would fail.
      var rawPath = window.location.pathname.replace(/^\/+/, '');
      var appLink = 'bitsheel:///' + rawPath + window.location.search;

      // Friendly tagline based on path.
      var tagline = document.getElementById('tagline');
      if (rawPath.indexOf('post/') === 0)      tagline.textContent = 'Someone shared a quest with you.';
      else if (rawPath.indexOf('user/') === 0) tagline.textContent = 'Check out their profile.';
      else if (rawPath.indexOf('join/') === 0) tagline.textContent = "You're invited to a collab quest.";

      var iosBtn = document.getElementById('iosStore');
      var androidBtn = document.getElementById('androidStore');
      iosBtn.href = APP_STORE_URL;
      androidBtn.href = PLAY_STORE_URL;

      var openBtn = document.getElementById('openApp');
      openBtn.href = appLink;

      // Hide the irrelevant store on mobile to reduce visual noise.
      if (isIOS) androidBtn.style.display = 'none';
      else if (isAndroid) iosBtn.style.display = 'none';

      // Auto-attempt to open the app on first load (mobile only). If the app
      // isn't installed, fall back to the right store after a short delay.
      var didFallback = false;
      var tFallback;

      function fallback() {
        if (didFallback) return;
        didFallback = true;
        clearTimeout(tFallback);
        if (isIOS) window.location.href = APP_STORE_URL;
        else if (isAndroid) window.location.href = PLAY_STORE_URL;
      }

      function tryOpenApp() {
        if (!isMobile) return;
        document.addEventListener('visibilitychange', function () {
          if (document.hidden) didFallback = true;
        });
        window.addEventListener('pagehide', function () { didFallback = true; });

        window.location.href = appLink;
        tFallback = setTimeout(fallback, 1800);
      }

      openBtn.addEventListener('click', function (e) {
        e.preventDefault();
        didFallback = false;
        tryOpenApp();
      });

      if (isMobile) {
        // Small delay so the page paints before the URL change.
        setTimeout(tryOpenApp, 80);
      }
    })();
  </script>
</body>
</html>
