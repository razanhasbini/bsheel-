name: business_web
description: Bsheel - business partner dashboard.
version: 0.0.1
publish_to: none

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # Needed for usePathUrlStrategy(), so the app works under its /business
  # base href instead of hash routing.
  flutter_web_plugins:
    sdk: flutter

  # Internal packages — the same transport, models and design system the
  # other two apps use, so a business reads exactly what the API returns.
  app_core:
    path: ../../packages/app_core
  app_models:
    path: ../../packages/app_models
  app_repositories:
    path: ../../packages/app_repositories
  shared_ui:
    path: ../../packages/shared_ui

  flutter_riverpod: ^2.4.0
  go_router: ^13.0.0

  # Required by app_repositories (social auth lives in the shared bundle
  # even though this app only ever uses email sign-in).
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^6.1.0
  crypto: ^3.0.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
