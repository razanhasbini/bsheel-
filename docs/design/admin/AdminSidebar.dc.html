<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:230px;flex:none;height:100%;background:#1A1330;border-right:2px solid #1A1330;display:flex;flex-direction:column;font-family:'DM Sans',sans-serif">
  <div style="padding:20px 16px 16px;display:flex;flex-direction:column;gap:2px">
    <div style="font-family:Syne,sans-serif;font-weight:800;font-size:21px;letter-spacing:-0.03em;color:#FFF9EE">BSHEEL</div>
    <div style="font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;letter-spacing:0.16em;color:#FFC224">ADMIN CONSOLE</div>
  </div>
  <div style="flex:1;min-height:0;overflow:auto;padding:6px 10px 14px;display:flex;flex-direction:column;gap:3px">
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="16">
      <div style="{{ it.rowStyle }}">
        <span>{{ it.label }}</span>
        <span style="{{ it.badgeStyle }}">{{ it.badge }}</span>
      </div>
    </sc-for>
  </div>
  <div style="padding:12px 16px 16px;border-top:2px solid #2A2450;display:flex;align-items:center;gap:9px">
    <span style="width:30px;height:30px;border-radius:9px;border:2px solid #FFF9EE;background:#FF5A6E;flex:none"></span>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column">
      <span style="font-family:Syne,sans-serif;font-weight:700;font-size:13px;color:#FFF9EE">s.haddad</span>
      <span style="font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;letter-spacing:0.1em;color:#C7C0E0">MODERATOR</span>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:230,&quot;height&quot;:800},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;dashboard&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;dashboard&quot;,&quot;moderation&quot;,&quot;appeals&quot;,&quot;history&quot;,&quot;feed&quot;,&quot;quests&quot;,&quot;qotd&quot;,&quot;users&quot;,&quot;xp&quot;,&quot;announcements&quot;,&quot;auto&quot;,&quot;reports&quot;,&quot;injection&quot;,&quot;signups&quot;,&quot;suggestions&quot;,&quot;settings&quot;]}}">
const NAV = [
  ['dashboard', 'DASHBOARD', ''],
  ['moderation', 'MODERATION', '14'],
  ['appeals', 'APPEALS', '3'],
  ['history', 'HISTORY', ''],
  ['feed', 'FEED', ''],
  ['quests', 'QUESTS', ''],
  ['qotd', 'QUEST OF THE DAY', ''],
  ['users', 'USERS', ''],
  ['xp', 'XP', ''],
  ['announcements', 'ANNOUNCEMENTS', ''],
  ['auto', 'AUTO NOTIFICATIONS', ''],
  ['reports', 'REPORTS', '2'],
  ['injection', 'INJECTION', ''],
  ['signups', 'WEB SIGNUPS', ''],
  ['suggestions', 'QUEST SUGGESTIONS', ''],
  ['settings', 'SETTINGS', ''],
];

class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'dashboard';
    const items = NAV.map(([id, label, badge]) => {
      const on = id === active;
      return {
        label,
        badge,
        rowStyle: [
          'display:flex', 'align-items:center', 'justify-content:space-between',
          'gap:8px', 'padding:9px 11px', 'border-radius:9px',
          "font-family:'JetBrains Mono',monospace", 'font-size:10px',
          'font-weight:700', 'letter-spacing:0.09em', 'cursor:pointer',
          'background:' + (on ? '#6B3BFF' : 'transparent'),
          'border:2px solid ' + (on ? '#FFF9EE' : 'transparent'),
          'color:' + (on ? '#FFFFFF' : '#C7C0E0'),
        ].join(';'),
        badgeStyle: badge
          ? [
              "font-family:'JetBrains Mono',monospace", 'font-size:9px', 'font-weight:700',
              'padding:1px 7px', 'border-radius:999px', 'border:2px solid #1A1330',
              'background:' + (on ? '#FFC224' : '#FF5A6E'),
              'color:#1A1330',
            ].join(';')
          : 'display:none',
      };
    });
    return { items };
  }
}
</script>
</body>
</html>
