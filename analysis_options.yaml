include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  errors:
    invalid_annotation_target: ignore

linter:
  rules:
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - avoid_print
    # `require_trailing_commas` is deliberately NOT enabled. CI runs
    # `dart format --set-exit-if-changed`, and the formatter removes
    # trailing commas wherever a call fits on one line — so the lint and
    # the formatter contradict each other and no tree can satisfy both.
    # The formatter owns comma placement.
    - sort_child_properties_last
    - unawaited_futures
    - prefer_single_quotes
