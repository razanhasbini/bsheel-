name: quest_app

packages:
  - apps/**
  - packages/**

scripts:
  get:
    run: melos exec -- flutter pub get

  analyze:
    run: melos exec -- flutter analyze

  # `app_models` and `app_contracts` are pure-Dart packages: neither
  # depends on the Flutter SDK, so `dart test` is the right runner (and
  # skips the Flutter test harness bootstrap entirely). Everything else —
  # both apps plus app_core / app_repositories / shared_ui — pulls in
  # flutter_test and must go through `flutter test`.
  #
  # Split into two scripts because no single command serves both, and
  # `test` runs both so `melos run test` still covers all 7 packages.
  # Previously `test` was `melos exec --ignore="app_models,app_repositories,
  # app_contracts" -- flutter test`, which silently excluded the wire
  # contract suite in packages/app_repositories/test from CI.
  test:dart:
    run: melos exec --scope="app_models,app_contracts" -- dart test
    description: Run the pure-Dart package tests with `dart test`.

  test:flutter:
    run: melos exec --ignore="app_models,app_contracts,admin_web" -- flutter test
    description: Run the Flutter package and app tests with `flutter test`.

  # admin_web is a web-only target and cannot be compiled for the VM: it
  # imports dart:js_interop, dart:ui_web and package:web for the CSV export
  # and the inline video element. Bare `flutter test` therefore fails to
  # compile it, which is what `test:flutter` used to do — so the admin
  # dashboard's tests never actually ran in CI.
  # `business_web` is deliberately NOT in here. It is a web app too, but
  # its own code imports nothing web-only — the shared transport, models
  # and design system are all VM-safe — so `test:flutter` compiles and runs
  # it. Move it here only if it ever gains a dart:ui_web / js_interop
  # dependency, because then bare `flutter test` stops compiling it and its
  # tests silently stop running, which is exactly what happened to
  # admin_web.
  test:web:
    run: melos exec --scope="admin_web" -- flutter test --platform chrome
    description: Run the admin dashboard's tests on Chrome, its real target.

  test:
    run: melos run test:dart && melos run test:flutter && melos run test:web
    description: Run every package's tests (pure-Dart, Flutter, then web).

  format:
    run: melos exec -- dart format .

  clean:
    run: melos exec -- flutter clean
