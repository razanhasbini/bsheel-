name: Deploy to server

# Whenever main changes, push the server-hosted parts of the app to Contabo:
#   • edge functions      -> /root/supabase-docker/volumes/functions
#   • new DB migrations    -> applied to the self-hosted Postgres (tracked, idempotent)
#   • admin dashboard      -> rebuilt (Flutter web) and served at https://admin.bsheel.app
# The mobile app binary is NOT deployed here (that ships via the App/Play Store).
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   CONTABO_SSH_KEY    private SSH key for root@<server>  (the ~/.ssh/contabo key)
#   CONTABO_HOST       169.58.16.247
#   SUPABASE_URL       https://api.bsheel.app
#   SUPABASE_ANON_KEY  the self-host anon JWT

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSHOPTS=-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20" >> "$GITHUB_ENV"
          echo "HOST=root@${{ secrets.CONTABO_HOST }}" >> "$GITHUB_ENV"

      # ── Edge functions + DB migrations ─────────────────────────────
      - name: Deploy edge functions
        run: |
          rsync -az -e "ssh $SSHOPTS" supabase/functions/ "$HOST:/root/supabase-docker/volumes/functions/"

      - name: Apply new migrations + restart functions
        run: |
          ssh $SSHOPTS "$HOST" 'mkdir -p /root/deploy/migrations'
          # applied/ holds frozen, already-applied history (tracked by name
          # in public._applied_migrations) — no need to ship it every deploy.
          rsync -az --exclude=applied --exclude=README.md -e "ssh $SSHOPTS" supabase/migrations/ "$HOST:/root/deploy/migrations/"
          scp $SSHOPTS scripts/server-deploy.sh "$HOST:/root/server-deploy.sh"
          scp $SSHOPTS supabase/bootstrap/admin_bootstrap.sql "$HOST:/root/deploy/admin_bootstrap.sql"
          # Admin creds arrive only at runtime over the SSH channel — never
          # written to git. server-deploy.sh no-ops when NEW_ADMIN_PASSWORD
          # is unset, so this is safe on every deploy.
          ssh $SSHOPTS "$HOST" \
            "NEW_ADMIN_EMAIL='${{ secrets.NEW_ADMIN_EMAIL }}' \
             NEW_ADMIN_USERNAME='${{ secrets.NEW_ADMIN_USERNAME }}' \
             NEW_ADMIN_PASSWORD='${{ secrets.NEW_ADMIN_PASSWORD }}' \
             bash /root/server-deploy.sh"

      # ── Admin dashboard (Flutter web) ──────────────────────────────
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build admin_web
        working-directory: apps/admin_web
        run: |
          flutter pub get
          flutter build web --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Deploy admin_web
        env:
          ADMIN_WEB_ROOT: ${{ secrets.ADMIN_WEB_ROOT }}
        run: |
          # Directory Caddy actually serves admin.bsheel.app from. Set the
          # ADMIN_WEB_ROOT repo secret to your real Caddy root once (find it
          # with:  grep -rn "admin.bsheel.app" /etc/caddy /root/supabase-docker
          # then read the `root * <path>` line). Falls back to the legacy
          # path if the secret is unset — which is exactly the mismatch that
          # made old deploys land in a folder Caddy never read.
          TARGET="${ADMIN_WEB_ROOT:-/root/supabase-docker/volumes/admin}"
          echo "Publishing admin build → $TARGET"
          ssh $SSHOPTS "$HOST" "mkdir -p '$TARGET'"
          # --delete so the stale custom service worker + old bundle are removed.
          rsync -az --delete -e "ssh $SSHOPTS" apps/admin_web/build/web/ "$HOST:$TARGET/"

          # No Caddy action needed: the admin dashboard is static files served
          # from disk, so the rsync above is live on the very next request.
          #
          # DO NOT `caddy reload` this stack. Its Basic-Auth password is hashed
          # ONCE at container start (see the caddy `command:` in
          # docker-compose.caddy.yml). A `caddy reload` re-reads the Caddyfile
          # with the UNHASHED env var, so Basic-Auth then compares bcrypt
          # against plaintext and admin login breaks (HTTP 401). If you ever
          # change the Caddyfile itself, apply it with a full container restart:
          #   ssh <host> 'cd /root/supabase-docker && docker compose restart caddy'
          echo "✅ Deployed to $TARGET. Admin: https://admin.bsheel.app  API: https://api.bsheel.app"
