name: app_repositories
description: Repository contracts and their HTTP implementations, shared by the mobile and admin apps.
version: 0.0.1
publish_to: none

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  app_core:
    path: ../app_core
  app_models:
    path: ../app_models
  app_contracts:
    path: ../app_contracts
  http: ^1.2.2
  mime: ^2.0.0
  sign_in_with_apple: ^6.1.0
  google_sign_in: ^7.2.0
  url_launcher: ^6.2.0
  crypto: ^3.0.3
  firebase_messaging: ^15.0.0
  flutter_secure_storage: ^10.0.0
  socket_io_client: ^3.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0
